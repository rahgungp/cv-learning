<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Perbandingan Transfer Learning vs Training from Scratch">
  <defs>
    <marker id="arrTL" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 Z" fill="#1a7340"/>
    </marker>
    <marker id="arrRed" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 Z" fill="#ef4444"/>
    </marker>
  </defs>

  <text x="280" y="22" text-anchor="middle" fill="#1a7340" font-size="13" font-weight="700">Transfer Learning vs Training from Scratch</text>

  <!-- === LEFT: Training from Scratch === -->
  <text x="135" y="48" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="700">❌ Training from Scratch</text>

  <!-- Random weights box -->
  <rect x="65" y="58" width="140" height="36" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="135" y="78" text-anchor="middle" fill="#ef4444" font-size="9" font-weight="700">Random Weights</text>

  <line x1="135" y1="94" x2="135" y2="110" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrRed)"/>

  <!-- Large dataset required -->
  <rect x="55" y="110" width="160" height="36" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="135" y="125" text-anchor="middle" fill="#dc2626" font-size="9" font-weight="700">🗂️ Dataset BESAR</text>
  <text x="135" y="140" text-anchor="middle" fill="#dc2626" font-size="8">Butuh jutaan data</text>

  <line x1="135" y1="146" x2="135" y2="162" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrRed)"/>

  <!-- Long training -->
  <rect x="55" y="162" width="160" height="36" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="135" y="177" text-anchor="middle" fill="#dc2626" font-size="9" font-weight="700">⏱️ Training LAMA</text>
  <text x="135" y="192" text-anchor="middle" fill="#dc2626" font-size="8">Minggu / bulan GPU</text>

  <line x1="135" y1="198" x2="135" y2="214" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrRed)"/>

  <!-- Result -->
  <rect x="65" y="214" width="140" height="36" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="135" y="234" text-anchor="middle" fill="#dc2626" font-size="9" font-weight="700">Hasil? Tidak tentu</text>

  <!-- Stats from scratch -->
  <rect x="55" y="262" width="160" height="24" rx="6" fill="#fee2e2"/>
  <text x="135" y="278" text-anchor="middle" fill="#dc2626" font-size="8">Waktu: Lama · Data: Banyak · Cost: Tinggi</text>

  <!-- Divider -->
  <line x1="280" y1="40" x2="280" y2="295" stroke="#e2e8e2" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="280" y="22" text-anchor="middle" fill="#4a6049" font-size="11">VS</text>

  <!-- === RIGHT: Transfer Learning === -->
  <text x="415" y="48" text-anchor="middle" fill="#1a7340" font-size="10" font-weight="700">✅ Transfer Learning</text>

  <!-- Pretrained model -->
  <rect x="345" y="58" width="140" height="36" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="415" y="75" text-anchor="middle" fill="#16a34a" font-size="9" font-weight="700">🧠 Pretrained Model</text>
  <text x="415" y="89" text-anchor="middle" fill="#16a34a" font-size="8">ResNet / VGG (ImageNet)</text>

  <line x1="415" y1="94" x2="415" y2="110" stroke="#1a7340" stroke-width="1.5" marker-end="url(#arrTL)"/>

  <!-- Small dataset ok -->
  <rect x="335" y="110" width="160" height="36" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="415" y="125" text-anchor="middle" fill="#16a34a" font-size="9" font-weight="700">🗂️ Dataset Kecil OK!</text>
  <text x="415" y="140" text-anchor="middle" fill="#16a34a" font-size="8">Ratusan atau ribuan data</text>

  <line x1="415" y1="146" x2="415" y2="162" stroke="#1a7340" stroke-width="1.5" marker-end="url(#arrTL)"/>

  <!-- Fine-tuning options -->
  <rect x="335" y="162" width="75" height="36" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="372" y="177" text-anchor="middle" fill="#1d4ed8" font-size="8" font-weight="700">Feature</text>
  <text x="372" y="190" text-anchor="middle" fill="#1d4ed8" font-size="8">Extraction</text>

  <rect x="420" y="162" width="75" height="36" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="457" y="177" text-anchor="middle" fill="#5b21b6" font-size="8" font-weight="700">Fine-</text>
  <text x="457" y="190" text-anchor="middle" fill="#5b21b6" font-size="8">tuning</text>

  <line x1="415" y1="198" x2="415" y2="214" stroke="#1a7340" stroke-width="1.5" marker-end="url(#arrTL)"/>

  <!-- Great result -->
  <rect x="345" y="214" width="140" height="36" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="415" y="229" text-anchor="middle" fill="#16a34a" font-size="9" font-weight="700">🎯 Hasil Akurat</text>
  <text x="415" y="244" text-anchor="middle" fill="#16a34a" font-size="8">Akurasi tinggi, efisien</text>

  <!-- Stats TL -->
  <rect x="335" y="262" width="160" height="24" rx="6" fill="#dcfce7"/>
  <text x="415" y="278" text-anchor="middle" fill="#16a34a" font-size="8">Waktu: Singkat · Data: Sedikit · Cost: Rendah</text>
</svg>
