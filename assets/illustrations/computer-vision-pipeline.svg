<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Computer Vision Pipeline: dari kamera hingga keputusan">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 Z" fill="#1a7340"/>
    </marker>
  </defs>
  <!-- Background -->
  <rect width="560" height="360" fill="none"/>
  <!-- Nodes -->
  <!-- Camera -->
  <rect x="15" y="130" width="70" height="50" rx="8" fill="#1a7340"/>
  <text x="50" y="148" text-anchor="middle" fill="white" font-size="18">📷</text>
  <text x="50" y="168" text-anchor="middle" fill="white" font-size="9" font-weight="700">CAMERA</text>
  <!-- Arrow -->
  <line x1="85" y1="155" x2="100" y2="155" stroke="#1a7340" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Image -->
  <rect x="100" y="130" width="70" height="50" rx="8" fill="#125230"/>
  <text x="135" y="148" text-anchor="middle" fill="white" font-size="18">🖼️</text>
  <text x="135" y="168" text-anchor="middle" fill="white" font-size="9" font-weight="700">IMAGE</text>
  <!-- Arrow -->
  <line x1="170" y1="155" x2="185" y2="155" stroke="#1a7340" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Preprocessing -->
  <rect x="185" y="130" width="70" height="50" rx="8" fill="#0ea5e9"/>
  <text x="220" y="148" text-anchor="middle" fill="white" font-size="18">⚙️</text>
  <text x="220" y="168" text-anchor="middle" fill="white" font-size="8" font-weight="700">PREPROCESS</text>
  <!-- Arrow -->
  <line x1="255" y1="155" x2="270" y2="155" stroke="#1a7340" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Feature -->
  <rect x="270" y="130" width="70" height="50" rx="8" fill="#8b5cf6"/>
  <text x="305" y="148" text-anchor="middle" fill="white" font-size="18">🔍</text>
  <text x="305" y="168" text-anchor="middle" fill="white" font-size="8" font-weight="700">FEATURES</text>
  <!-- Arrow -->
  <line x1="340" y1="155" x2="355" y2="155" stroke="#1a7340" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Model -->
  <rect x="355" y="130" width="70" height="50" rx="8" fill="#1a7340"/>
  <text x="390" y="148" text-anchor="middle" fill="white" font-size="18">🧠</text>
  <text x="390" y="168" text-anchor="middle" fill="white" font-size="9" font-weight="700">MODEL</text>
  <!-- Arrow -->
  <line x1="425" y1="155" x2="440" y2="155" stroke="#1a7340" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Prediction -->
  <rect x="440" y="130" width="70" height="50" rx="8" fill="#f59e0b"/>
  <text x="475" y="148" text-anchor="middle" fill="white" font-size="18">📊</text>
  <text x="475" y="168" text-anchor="middle" fill="white" font-size="8" font-weight="700">PREDICTION</text>

  <!-- Labels below -->
  <text x="50"  y="205" text-anchor="middle" fill="#4a6049" font-size="8">Input</text>
  <text x="135" y="205" text-anchor="middle" fill="#4a6049" font-size="8">Raw Data</text>
  <text x="220" y="205" text-anchor="middle" fill="#4a6049" font-size="8">Clean Data</text>
  <text x="305" y="205" text-anchor="middle" fill="#4a6049" font-size="8">Representation</text>
  <text x="390" y="205" text-anchor="middle" fill="#4a6049" font-size="8">Learning</text>
  <text x="475" y="205" text-anchor="middle" fill="#4a6049" font-size="8">Output</text>

  <!-- Title -->
  <text x="280" y="50" text-anchor="middle" fill="#1a7340" font-size="14" font-weight="700">Computer Vision Pipeline</text>
  <text x="280" y="68" text-anchor="middle" fill="#4a6049" font-size="10">Dari data visual mentah menuju prediksi dan keputusan</text>

  <!-- Step numbers -->
  <circle cx="50"  cy="105" r="10" fill="#1a7340"/>
  <text x="50"  y="109" text-anchor="middle" fill="white" font-size="9" font-weight="700">1</text>
  <circle cx="135" cy="105" r="10" fill="#125230"/>
  <text x="135" y="109" text-anchor="middle" fill="white" font-size="9" font-weight="700">2</text>
  <circle cx="220" cy="105" r="10" fill="#0ea5e9"/>
  <text x="220" y="109" text-anchor="middle" fill="white" font-size="9" font-weight="700">3</text>
  <circle cx="305" cy="105" r="10" fill="#8b5cf6"/>
  <text x="305" y="109" text-anchor="middle" fill="white" font-size="9" font-weight="700">4</text>
  <circle cx="390" cy="105" r="10" fill="#1a7340"/>
  <text x="390" y="109" text-anchor="middle" fill="white" font-size="9" font-weight="700">5</text>
  <circle cx="475" cy="105" r="10" fill="#f59e0b"/>
  <text x="475" y="109" text-anchor="middle" fill="white" font-size="9" font-weight="700">6</text>

  <!-- Bottom note -->
  <text x="280" y="300" text-anchor="middle" fill="#7a9078" font-size="9">
    Setiap tahap memproses informasi visual untuk menghasilkan pemahaman bermakna
  </text>
</svg>
