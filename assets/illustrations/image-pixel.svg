<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Representasi piksel gambar digital">
  <text x="280" y="28" text-anchor="middle" fill="#1a7340" font-size="13" font-weight="700">Representasi Citra Digital</text>
  <text x="280" y="46" text-anchor="middle" fill="#4a6049" font-size="9">Gambar adalah kumpulan piksel dengan nilai intensitas warna</text>

  <!-- Grid pixel 6x5 -->
  <g transform="translate(20,60)">
    <!-- R Channel -->
    <text x="60" y="-8" text-anchor="middle" fill="#ef4444" font-size="9" font-weight="700">Red Channel</text>
    <rect x="0"   y="0"  width="28" height="28" fill="#ff0000" opacity="1.0"/>
    <rect x="28"  y="0"  width="28" height="28" fill="#cc0000"/>
    <rect x="56"  y="0"  width="28" height="28" fill="#990000"/>
    <rect x="84"  y="0"  width="28" height="28" fill="#ff3333"/>
    <rect x="0"   y="28" width="28" height="28" fill="#ff6666"/>
    <rect x="28"  y="28" width="28" height="28" fill="#cc3333"/>
    <rect x="56"  y="28" width="28" height="28" fill="#993300"/>
    <rect x="84"  y="28" width="28" height="28" fill="#ff9999"/>
    <rect x="0"   y="56" width="28" height="28" fill="#cc6666"/>
    <rect x="28"  y="56" width="28" height="28" fill="#991111"/>
    <rect x="56"  y="56" width="28" height="28" fill="#ff4444"/>
    <rect x="84"  y="56" width="28" height="28" fill="#dd2222"/>

    <!-- Pixel values on R -->
    <text x="14"  y="18" text-anchor="middle" fill="white" font-size="7">255</text>
    <text x="42"  y="18" text-anchor="middle" fill="white" font-size="7">204</text>
    <text x="70"  y="18" text-anchor="middle" fill="white" font-size="7">153</text>
    <text x="98"  y="18" text-anchor="middle" fill="white" font-size="7">255</text>
    <text x="14"  y="46" text-anchor="middle" fill="white" font-size="7">102</text>
    <text x="42"  y="46" text-anchor="middle" fill="white" font-size="7">204</text>
    <text x="70"  y="46" text-anchor="middle" fill="white" font-size="7">153</text>
    <text x="98"  y="46" text-anchor="middle" fill="white" font-size="7"> 51</text>
  </g>

  <!-- G Channel -->
  <g transform="translate(200,60)">
    <text x="60" y="-8" text-anchor="middle" fill="#22c55e" font-size="9" font-weight="700">Green Channel</text>
    <rect x="0"   y="0"  width="28" height="28" fill="#00cc00"/>
    <rect x="28"  y="0"  width="28" height="28" fill="#009900"/>
    <rect x="56"  y="0"  width="28" height="28" fill="#00ff00"/>
    <rect x="84"  y="0"  width="28" height="28" fill="#006600"/>
    <rect x="0"   y="28" width="28" height="28" fill="#33cc33"/>
    <rect x="28"  y="28" width="28" height="28" fill="#66ff66"/>
    <rect x="56"  y="28" width="28" height="28" fill="#009933"/>
    <rect x="84"  y="28" width="28" height="28" fill="#00cc66"/>
    <rect x="0"   y="56" width="28" height="28" fill="#006633"/>
    <rect x="28"  y="56" width="28" height="28" fill="#33ff33"/>
    <rect x="56"  y="56" width="28" height="28" fill="#00cc44"/>
    <rect x="84"  y="56" width="28" height="28" fill="#009944"/>
    <text x="14"  y="18" text-anchor="middle" fill="white" font-size="7">200</text>
    <text x="42"  y="18" text-anchor="middle" fill="white" font-size="7">153</text>
    <text x="70"  y="18" text-anchor="middle" fill="#000" font-size="7">255</text>
    <text x="98"  y="18" text-anchor="middle" fill="white" font-size="7">100</text>
  </g>

  <!-- B Channel -->
  <g transform="translate(380,60)">
    <text x="60" y="-8" text-anchor="middle" fill="#3b82f6" font-size="9" font-weight="700">Blue Channel</text>
    <rect x="0"   y="0"  width="28" height="28" fill="#0000ff"/>
    <rect x="28"  y="0"  width="28" height="28" fill="#0000cc"/>
    <rect x="56"  y="0"  width="28" height="28" fill="#3333ff"/>
    <rect x="84"  y="0"  width="28" height="28" fill="#6666ff"/>
    <rect x="0"   y="28" width="28" height="28" fill="#0000aa"/>
    <rect x="28"  y="28" width="28" height="28" fill="#0033cc"/>
    <rect x="56"  y="28" width="28" height="28" fill="#3366ff"/>
    <rect x="84"  y="28" width="28" height="28" fill="#0066ff"/>
    <rect x="0"   y="56" width="28" height="28" fill="#000099"/>
    <rect x="28"  y="56" width="28" height="28" fill="#0000dd"/>
    <rect x="56"  y="56" width="28" height="28" fill="#1111ff"/>
    <rect x="84"  y="56" width="28" height="28" fill="#4444cc"/>
    <text x="14"  y="18" text-anchor="middle" fill="white" font-size="7">255</text>
    <text x="42"  y="18" text-anchor="middle" fill="white" font-size="7">204</text>
    <text x="70"  y="18" text-anchor="middle" fill="white" font-size="7"> 51</text>
    <text x="98"  y="18" text-anchor="middle" fill="white" font-size="7">102</text>
  </g>

  <!-- Plus signs -->
  <text x="185" y="105" fill="#1a7340" font-size="18" font-weight="700">+</text>
  <text x="365" y="105" fill="#1a7340" font-size="18" font-weight="700">+</text>

  <!-- Result label -->
  <text x="280" y="200" text-anchor="middle" fill="#1a7340" font-size="11" font-weight="700">= Gambar RGB (3 Channel)</text>

  <!-- Info boxes -->
  <rect x="20" y="220" width="155" height="60" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="97"  y="237" text-anchor="middle" fill="#1a7340" font-size="8" font-weight="700">PIXEL</text>
  <text x="97"  y="252" text-anchor="middle" fill="#4a6049" font-size="8">Unit terkecil dari gambar</text>
  <text x="97"  y="265" text-anchor="middle" fill="#4a6049" font-size="8">Berisi nilai warna (0–255)</text>
  <text x="97"  y="278" text-anchor="middle" fill="#4a6049" font-size="8">per channel RGB</text>

  <rect x="200" y="220" width="155" height="60" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="277" y="237" text-anchor="middle" fill="#1d4ed8" font-size="8" font-weight="700">RESOLUSI</text>
  <text x="277" y="252" text-anchor="middle" fill="#4a6049" font-size="8">Lebar × Tinggi (pixel)</text>
  <text x="277" y="265" text-anchor="middle" fill="#4a6049" font-size="8">Contoh: 1920 × 1080</text>
  <text x="277" y="278" text-anchor="middle" fill="#4a6049" font-size="8">= 2.073.600 piksel</text>

  <rect x="380" y="220" width="155" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="457" y="237" text-anchor="middle" fill="#92400e" font-size="8" font-weight="700">CHANNEL</text>
  <text x="457" y="252" text-anchor="middle" fill="#4a6049" font-size="8">RGB = 3 channel</text>
  <text x="457" y="265" text-anchor="middle" fill="#4a6049" font-size="8">Grayscale = 1 channel</text>
  <text x="457" y="278" text-anchor="middle" fill="#4a6049" font-size="8">RGBA = 4 channel</text>

  <!-- Shape notation -->
  <text x="280" y="320" text-anchor="middle" fill="#1a7340" font-size="10" font-weight="700">Shape Array: (Tinggi, Lebar, Channel) — contoh: (224, 224, 3)</text>
  <text x="280" y="338" text-anchor="middle" fill="#7a9078" font-size="9">NumPy array shape: image.shape → (H, W, C)</text>

  <!-- Grid border -->
  <rect x="20"  y="52" width="112" height="112" fill="none" stroke="#ef4444" stroke-width="1.5" rx="2"/>
  <rect x="200" y="52" width="112" height="112" fill="none" stroke="#22c55e" stroke-width="1.5" rx="2"/>
  <rect x="380" y="52" width="112" height="112" fill="none" stroke="#3b82f6" stroke-width="1.5" rx="2"/>
</svg>
