<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram arsitektur CNN">
  <defs>
    <marker id="arr2" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 Z" fill="#1a7340"/>
    </marker>
    <!-- Blue gradient for conv -->
    <linearGradient id="gConv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <!-- Orange gradient for pool -->
    <linearGradient id="gPool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Green gradient for fc -->
    <linearGradient id="gFC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <!-- Purple for relu -->
    <linearGradient id="gRelu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>

  <text x="280" y="22" text-anchor="middle" fill="#1a7340" font-size="13" font-weight="700">Convolutional Neural Network (CNN) Architecture</text>

  <!-- Input Image block - 3D cube effect -->
  <g transform="translate(10,65)">
    <rect x="4" y="4" width="52" height="130" rx="4" fill="#64748b" opacity="0.5"/>
    <rect x="0" y="0" width="52" height="130" rx="4" fill="#94a3b8"/>
    <text x="26" y="-8" text-anchor="middle" fill="#4a6049" font-size="8" font-weight="700">INPUT</text>
    <text x="26" y="4"  text-anchor="middle" fill="#4a6049" font-size="7">224×224×3</text>
    <text x="26" y="70" text-anchor="middle" fill="white" font-size="18" transform="rotate(-90,26,70)">IMAGE</text>
  </g>

  <!-- Arrow -->
  <line x1="65" y1="130" x2="82" y2="130" stroke="#1a7340" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Conv Layer 1 -->
  <g transform="translate(82,80)">
    <rect x="4" y="4" width="44" height="110" rx="4" fill="#1e40af" opacity="0.5"/>
    <rect x="0" y="0" width="44" height="110" rx="4" fill="url(#gConv)"/>
    <text x="22" y="-8" text-anchor="middle" fill="#3b82f6" font-size="8" font-weight="700">CONV</text>
    <text x="22" y="4"  text-anchor="middle" fill="white" font-size="6">32 filters</text>
    <text x="22" y="58" text-anchor="middle" fill="white" font-size="9" font-weight="700" transform="rotate(-90,22,58)">Feature Map</text>
  </g>

  <!-- Arrow -->
  <line x1="130" y1="130" x2="148" y2="130" stroke="#1a7340" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- ReLU -->
  <g transform="translate(148,105)">
    <rect x="0" y="0" width="36" height="58" rx="4" fill="url(#gRelu)"/>
    <text x="18" y="-8" text-anchor="middle" fill="#a855f7" font-size="8" font-weight="700">ReLU</text>
    <text x="18" y="32" text-anchor="middle" fill="white" font-size="8" font-weight="700" transform="rotate(-90,18,32)">Activation</text>
  </g>

  <!-- Arrow -->
  <line x1="186" y1="130" x2="203" y2="130" stroke="#1a7340" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- MaxPool -->
  <g transform="translate(203,95)">
    <rect x="4" y="4" width="36" height="75" rx="4" fill="#92400e" opacity="0.5"/>
    <rect x="0" y="0" width="36" height="75" rx="4" fill="url(#gPool)"/>
    <text x="18" y="-8" text-anchor="middle" fill="#f59e0b" font-size="8" font-weight="700">POOL</text>
    <text x="18" y="4"  text-anchor="middle" fill="white" font-size="6">2×2</text>
    <text x="18" y="40" text-anchor="middle" fill="white" font-size="8" font-weight="700" transform="rotate(-90,18,40)">MaxPool</text>
  </g>

  <!-- Arrow -->
  <line x1="242" y1="130" x2="258" y2="130" stroke="#1a7340" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Conv Layer 2 -->
  <g transform="translate(258,90)">
    <rect x="4" y="4" width="36" height="90" rx="4" fill="#1e40af" opacity="0.5"/>
    <rect x="0" y="0" width="36" height="90" rx="4" fill="url(#gConv)"/>
    <text x="18" y="-8" text-anchor="middle" fill="#3b82f6" font-size="8" font-weight="700">CONV</text>
    <text x="18" y="4"  text-anchor="middle" fill="white" font-size="6">64 filters</text>
    <text x="18" y="48" text-anchor="middle" fill="white" font-size="8" font-weight="700" transform="rotate(-90,18,48)">Feature Map</text>
  </g>

  <!-- Arrow -->
  <line x1="298" y1="130" x2="314" y2="130" stroke="#1a7340" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- ReLU 2 -->
  <g transform="translate(314,108)">
    <rect x="0" y="0" width="30" height="48" rx="4" fill="url(#gRelu)"/>
    <text x="15" y="-8" text-anchor="middle" fill="#a855f7" font-size="8" font-weight="700">ReLU</text>
    <text x="15" y="27" text-anchor="middle" fill="white" font-size="7" font-weight="700" transform="rotate(-90,15,27)">Act.</text>
  </g>

  <!-- Arrow -->
  <line x1="347" y1="130" x2="363" y2="130" stroke="#1a7340" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- MaxPool 2 -->
  <g transform="translate(363,105)">
    <rect x="4" y="4" width="30" height="58" rx="4" fill="#92400e" opacity="0.5"/>
    <rect x="0" y="0" width="30" height="58" rx="4" fill="url(#gPool)"/>
    <text x="15" y="-8" text-anchor="middle" fill="#f59e0b" font-size="8" font-weight="700">POOL</text>
    <text x="15" y="32" text-anchor="middle" fill="white" font-size="7" font-weight="700" transform="rotate(-90,15,32)">Max</text>
  </g>

  <!-- Arrow -->
  <line x1="396" y1="130" x2="412" y2="130" stroke="#1a7340" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Flatten label -->
  <text x="413" y="127" fill="#7a9078" font-size="7" transform="rotate(-90,413,127)">FLATTEN</text>

  <!-- FC Layer -->
  <g transform="translate(420,70)">
    <!-- Neurons visual -->
    <circle cx="20" cy="15"  r="8" fill="url(#gFC)"/>
    <circle cx="20" cy="40"  r="8" fill="url(#gFC)"/>
    <circle cx="20" cy="65"  r="8" fill="url(#gFC)"/>
    <circle cx="20" cy="90"  r="8" fill="url(#gFC)"/>
    <circle cx="20" cy="115" r="8" fill="url(#gFC)"/>
    <text x="20" y="-8" text-anchor="middle" fill="#22c55e" font-size="8" font-weight="700">FC</text>
  </g>

  <!-- Arrow -->
  <line x1="450" y1="130" x2="468" y2="130" stroke="#1a7340" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Output -->
  <g transform="translate(470,80)">
    <rect x="0" y="0" width="75" height="100" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
    <text x="37" y="-8" text-anchor="middle" fill="#16a34a" font-size="8" font-weight="700">SOFTMAX</text>
    <text x="37" y="14" text-anchor="middle" fill="#16a34a" font-size="7">🐱 Cat  92%</text>
    <line x1="10" y1="22" x2="65" y2="22" stroke="#d1fae5" stroke-width="1"/>
    <text x="37" y="35" text-anchor="middle" fill="#ef4444" font-size="7">🐶 Dog   6%</text>
    <line x1="10" y1="43" x2="65" y2="43" stroke="#d1fae5" stroke-width="1"/>
    <text x="37" y="56" text-anchor="middle" fill="#6b7280" font-size="7">🐦 Bird  2%</text>
    <line x1="10" y1="64" x2="65" y2="64" stroke="#d1fae5" stroke-width="1"/>
    <!-- Bar chart mini -->
    <rect x="10" y="76" width="55" height="6" rx="2" fill="#e5e7eb"/>
    <rect x="10" y="76" width="51" height="6" rx="2" fill="#22c55e"/>
    <text x="37" y="95" text-anchor="middle" fill="#16a34a" font-size="9" font-weight="700">🐱 CAT!</text>
  </g>

  <!-- Bottom labels -->
  <text x="36"  y="260" text-anchor="middle" fill="#4a6049" font-size="7">Input Layer</text>
  <text x="106" y="260" text-anchor="middle" fill="#3b82f6" font-size="7">Conv Layer 1</text>
  <text x="167" y="260" text-anchor="middle" fill="#a855f7" font-size="7">Activation</text>
  <text x="222" y="260" text-anchor="middle" fill="#f59e0b" font-size="7">Pooling 1</text>
  <text x="277" y="260" text-anchor="middle" fill="#3b82f6" font-size="7">Conv Layer 2</text>
  <text x="330" y="260" text-anchor="middle" fill="#a855f7" font-size="7">Activation</text>
  <text x="380" y="260" text-anchor="middle" fill="#f59e0b" font-size="7">Pooling 2</text>
  <text x="437" y="260" text-anchor="middle" fill="#22c55e" font-size="7">FC Layer</text>
  <text x="507" y="260" text-anchor="middle" fill="#16a34a" font-size="7">Output</text>

  <!-- Legend -->
  <rect x="30"  y="285" width="12" height="10" rx="2" fill="url(#gConv)"/>
  <text x="46"  y="294" fill="#4a6049" font-size="8">Convolution</text>
  <rect x="120" y="285" width="12" height="10" rx="2" fill="url(#gRelu)"/>
  <text x="136" y="294" fill="#4a6049" font-size="8">ReLU</text>
  <rect x="188" y="285" width="12" height="10" rx="2" fill="url(#gPool)"/>
  <text x="204" y="294" fill="#4a6049" font-size="8">Pooling</text>
  <rect x="256" y="285" width="12" height="10" rx="2" fill="url(#gFC)"/>
  <text x="272" y="294" fill="#4a6049" font-size="8">Fully Connected</text>

  <!-- Flow arrows (dashed top guide) -->
  <line x1="36" y1="56" x2="508" y2="56" stroke="#e2e8e2" stroke-width="1" stroke-dasharray="3,3"/>
</svg>
